name: RSS Feed Update

on:
  # スケジュール実行：毎週金曜日 中国時間 14:30（UTC 6:30）
  schedule:
    - cron: '30 6 * * 5'
  # 手動実行も可能にする
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest
    
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 依存関係をインストール
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 feedgen lxml
      
      - name: スクリプトを実行（デバッグモード）
        run: |
          python generate_rss.py
        env:
          RSS_OUTPUT_PATH: feed.xml
          PYTHONUNBUFFERED: 1  # 出力をバッファリングしない
      
      - name: デバッグ情報を表示
        if: always()
        run: |
          echo "=== ファイル一覧 ==="
          ls -la
          echo ""
          echo "=== debug.log (存在する場合) ==="
          cat debug.log || echo "debug.logは存在しません"
          echo ""
          echo "=== feed.xml (存在する場合) ==="
          if [ -f "feed.xml" ]; then
            echo "✅ feed.xmlが存在します"
            echo "ファイルサイズ: $(wc -c < feed.xml) bytes"
            echo "最初の20行:"
            head -20 feed.xml
          else
            echo "❌ feed.xmlが存在しません"
          fi
      
      - name: feed.xmlをアップロード（デバッグ用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-feed-output
          path: |
            feed.xml
            debug.log
            fetched_content.html
            *.log
            *.html
          retention-days: 7
          if-no-files-found: warn
      
      - name: feed.xmlをコミットしてプッシュ
        if: success() && hashFiles('feed.xml') != ''
        run: |
          echo "feed.xmlをコミットします"
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add feed.xml
          git diff --staged --quiet || git commit -m "RSSフィードを自動更新 ($(date '+%Y-%m-%d %H:%M:%S'))"
          git push origin ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: feed.xmlがない場合の処理
        if: failure() || hashFiles('feed.xml') == ''
        run: |
          echo "⚠ feed.xmlの生成に失敗しました"
          echo "デバッグ情報を確認してください"
          exit 1
